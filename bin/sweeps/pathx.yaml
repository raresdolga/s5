program: run_train
name: pathx_latest_rotrnn_sweep
project: rotrnn_clean_sweeps
entity: baesian-learning
method: grid
metric:
  name: Best Val Accuracy
  goal: maximize
parameters:
  global_lr:
    value: 0.004
  ssm_lr_base:
    values: [0.002, 0.004]
  r_min:
    values: [0.9, 0.99]
  r_max:
    value: 0.9999
  p_dropout:
    values: [0.0, 0.1]
  weight_decay:
    value: 0.05
  max_phase:
    values: [0.0314, 0.314]
  nheads:
    value: 64
  opt_config:
    value: "standard" #  'BfastandCdecay'
  ssm_type:
    value: "rotrnn"
  activation_fn:
    value: "half_glu1"
  batchnorm:
    value: "True"
  bn_momentum:
    value: 0.9
  bidirectional:
    value: "True"
  bsz:
    value: 32
  d_model:
    value: 128
  dataset:
    value: "pathx-classification"
  epochs:
    value: 75
  jax_seed:
    value: 16416
  n_layers:
    value: 6
  ssm_size_base:
    value: 256
  warmup_end:
    value: 1
  conj_sym:
    value: "False"
  
command:
- pdm
- run
- python
- "-u"
- "-m"
- ${program}
- "--USE_WANDB"
- "True"
- ${args}
- "--wandb_project"
- "s5_rotrnn"
- "--wandb_entity"
- "baesian-learning"